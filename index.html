<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dr. Francisco Javier Albacete Zapata | Endocrinología y Nutrición</title>

  <meta
    name="description"
    content="Web profesional del Dr. Francisco Javier Albacete Zapata, especialista en Endocrinología y Nutrición en Murcia. Trayectoria, formación, áreas de especialización y contacto."
  >

  <meta name="theme-color" content="#173d3a">

  <meta property="og:title" content="Dr. Francisco Javier Albacete Zapata">
  <meta
    property="og:description"
    content="Especialista en Endocrinología y Nutrición. Trayectoria profesional, formación, actividad científica y contacto."
  >
  <meta property="og:type" content="website">

  <style>

    /* =========================================================
       VARIABLES
    ========================================================= */

    :root {
      --bg: #f6f6f2;
      --bg-soft: #edeee9;
      --surface: #ffffff;

      --text: #15201f;
      --text-soft: #66716f;

      --primary: #173d3a;
      --primary-light: #dfe9e6;

      --border: rgba(21, 32, 31, 0.12);

      --max-width: 1180px;

      --radius-small: 14px;
      --radius-medium: 22px;
      --radius-large: 34px;

      --shadow:
        0 24px 70px rgba(30, 48, 45, 0.08);
    }

    /* =========================================================
       BASE
    ========================================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;

      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    img {
      max-width: 100%;
      display: block;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    ::selection {
      background: var(--primary);
      color: white;
    }

    .container {
      width: min(calc(100% - 40px), var(--max-width));
      margin-inline: auto;
    }

    section {
      padding: 110px 0;
    }

    .section-label {
      display: inline-block;
      margin-bottom: 18px;

      color: var(--primary);

      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.13em;
    }

    .section-title {
      max-width: 700px;

      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.3rem, 5vw, 4.2rem);
      font-weight: 400;
      letter-spacing: -0.045em;
      line-height: 1.03;
    }

    .section-intro {
      max-width: 660px;
      margin-top: 24px;

      color: var(--text-soft);
      font-size: 1.06rem;
    }

    /* =========================================================
       NAV
    ========================================================= */

    .nav-wrapper {
      position: fixed;
      z-index: 1000;
      top: 0;
      left: 0;

      width: 100%;

      border-bottom: 1px solid transparent;

      background: rgba(246, 246, 242, 0.82);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    nav {
      min-height: 76px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 30px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;

      font-size: 0.92rem;
      font-weight: 650;
    }

    .logo-symbol {
      width: 38px;
      height: 38px;

      display: grid;
      place-items: center;

      border-radius: 50%;

      background: var(--primary);
      color: white;

      font-family: Georgia, serif;
      font-size: 0.9rem;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 30px;

      list-style: none;

      color: #4c5755;
      font-size: 0.9rem;
    }

    .nav-links a {
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: var(--primary);
    }

    .nav-contact {
      padding: 11px 18px;

      border-radius: 999px;

      background: var(--primary);
      color: white !important;

      font-weight: 600;

      transition:
        transform 0.2s ease,
        background 0.2s ease;
    }

    .nav-contact:hover {
      transform: translateY(-2px);
      background: #0d302d;
    }

    /* =========================================================
       ... (el resto del CSS permanece igual) ...
    ========================================================= */
  </style>

  <!-- =========================================================
       DATOS ESTRUCTURADOS PARA GOOGLE
  ========================================================== -->

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Physician",
    "name": "Francisco Javier Albacete Zapata",
    "description": "Médico especialista en Endocrinología y Nutrición.",
    "url": "https://franciscoalbacete.com"
  }
  </script>
</head>
<body>

  <!-- CONTENIDO DE LA PÁGINA (se mantiene igual) -->

  <!-- Inserto automáticamente el snippet back-to-top alojado en public/back-to-top.html -->
  <script>
    (function(){
      // Carga el fragmento HTML que añadí en la rama feature/back-to-top-button
      fetch('https://raw.githubusercontent.com/dralbacete/Endocrinomurcia/feature/back-to-top-button/public/back-to-top.html')
        .then(function(res){ if (!res.ok) throw new Error('Network response was not ok'); return res.text(); })
        .then(function(html){
          try { document.body.insertAdjacentHTML('beforeend', html); }
          catch(e) { console.error('Inserción back-to-top fallida', e); }
        })
        .catch(function(){ /* Silenciar fallos en entornos sin acceso */ });
    })();
  </script>

</body>
</html>
