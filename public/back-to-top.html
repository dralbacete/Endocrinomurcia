<!-- BOTÓN "Volver arriba" - pegar antes de </body> -->
<button id="backToTop" aria-label="Volver al inicio" title="Volver al inicio">↑</button>

<style>
  #backToTop{
    position: fixed;
    right: 1rem;
    bottom: 1.25rem;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: #0d6efd;
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }
  #backToTop:focus {
    outline: 3px solid rgba(13,110,253,0.35);
    outline-offset: 2px;
  }
</style>

<script>
  (function(){
    const btn = document.getElementById('backToTop');
    if (!btn) return;

    function toggleBtn() {
      btn.style.display = window.scrollY > 100 ? 'flex' : 'none';
    }

    function scrollToTop(e) {
      e.preventDefault();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      // Si quieres devolver foco al main para accesibilidad:
      // document.querySelector('main')?.focus();
    }

    window.addEventListener('scroll', toggleBtn, { passive: true });
    btn.addEventListener('click', scrollToTop);
    toggleBtn();
  })();
</script>
